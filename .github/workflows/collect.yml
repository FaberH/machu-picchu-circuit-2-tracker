name: Collect Circuit 2 tickets
run-name: ${{ inputs.diagnostic_drill && 'Diagnostic drill (expected failure)' || 'Circuit 2 collection' }}
on:
  schedule:
    # GitHub schedules in UTC. Run every five minutes; the gate below limits
    # live reads to 05:30–22:00 Peru and stops after a confirmed daily sell-out.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      diagnostic_drill:
        description: 'Offline failure drill: validates evidence upload; intentionally fails'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['*.mjs', 'package*.json', '.github/workflows/collect.yml']
permissions:
  contents: write
concurrency:
  group: ticket-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test test.mjs
      - name: Check collection window and daily sell-out
        id: gate
        env:
          DRILL: ${{ inputs.diagnostic_drill }}
        run: |
          if [ "$DRILL" = "true" ]; then
            echo 'collect=true' >> "$GITHUB_OUTPUT"
          else
            node collect.mjs --gate
          fi
      - if: steps.gate.outputs.collect == 'true'
        run: npm ci
      - if: steps.gate.outputs.collect == 'true'
        run: npx playwright install --with-deps chromium
      - name: Read live tickets
        if: steps.gate.outputs.collect == 'true'
        id: scrape
        continue-on-error: true
        env:
          DRILL: ${{ inputs.diagnostic_drill }}
        run: |
          if [ "$DRILL" = "true" ]; then
            mkdir -p diagnostic-drill
            cd diagnostic-drill
            node ../collect.mjs --diagnostic-drill
          else
            node collect.mjs
          fi
      - name: Preserve observations, including failed reads
        if: always() && inputs.diagnostic_drill != true && (steps.scrape.outcome == 'success' || steps.scrape.outcome == 'failure')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record ticket observation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload failure evidence
        if: always() && (failure() || steps.scrape.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: collection-diagnostics-${{ github.run_id }}
          path: |
            diagnostics/
            data/
            REPORT.md
            diagnostic-drill/
          retention-days: 7
          if-no-files-found: warn
      - name: Report failed or stale collection
        if: steps.scrape.outcome == 'failure'
        run: exit 1
