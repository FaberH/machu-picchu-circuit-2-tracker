name: Collect Machu Picchu tickets
run-name: Ticket availability collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.mjs', 'package*.json', '.github/workflows/collect.yml']
permissions:
  contents: write
concurrency:
  group: ticket-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm test
      - name: Check Peru collection window and daily sell-out
        id: gate
        run: node collect.mjs --gate
      - name: Read public ticket API
        if: steps.gate.outputs.collect == 'true'
        id: collect
        continue-on-error: true
        run: node collect.mjs
      - name: Preserve observations, including failed reads
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs/data.json docs/observations.csv REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record ticket observation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload failure evidence
        if: always() && steps.collect.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: collection-diagnostics-${{ github.run_id }}
          path: |
            diagnostics/
            data/
            REPORT.md
          retention-days: 7
          if-no-files-found: warn
      - name: Report failed collection
        if: steps.collect.outcome == 'failure'
        run: exit 1

